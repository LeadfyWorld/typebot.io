version: "3.9"
services:
  typebot-db:
    image: postgres:17.5
    volumes:
      - ${PWD}/.typebot-build/database:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=typebot
      - POSTGRES_PASSWORD=typebot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  typebot-builder:
    build:
      context: .
      args:
        - SCOPE=builder
    depends_on:
      typebot-db:
        condition: service_healthy
    ports:
      - "8080:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env.docker
  typebot-viewer:
    build:
      context: .
      args:
        - SCOPE=viewer
    depends_on:
      typebot-db:
        condition: service_healthy
    ports:
      - "8081:3000"
    env_file: .env.docker
